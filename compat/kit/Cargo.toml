[package]
name = "ely-kit-compat"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false
description = "Ely and its pinned GPUI Kit in one app and one window."

[lib]
path = "src/lib.rs"

[features]
gpui-fast = ["ely-gpui-component/gpui-fast", "gpui-kit/gpui-fast"]

[dev-dependencies]
ely-gpui-component = { path = "../..", features = ["test-support"] }
gpui-kit = { version = "=0.10.0", features = ["test-support"] }

[workspace]
